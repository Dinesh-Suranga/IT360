# ============================================
# NGINX CONFIG — IT 360 (itthreesixty.com.au)
# Live file on the server: /etc/nginx/sites-available/itthreesixty.com.au
# TLS is a Cloudflare Origin Certificate (Cloudflare proxies the domain).
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name itthreesixty.com.au www.itthreesixty.com.au;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itthreesixty.com.au www.itthreesixty.com.au;

    # ---- Cloudflare Origin Certificate ----
    ssl_certificate     /etc/ssl/cloudflare/itthreesixty.pem;
    ssl_certificate_key /etc/ssl/cloudflare/itthreesixty.key;

    root /var/www/itthreesixty;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # ---- Security Headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    # CSP notes:
    #   script-src 'unsafe-inline' → tiny inline <script> in <head> (adds the "js" class)
    #   cdn.jsdelivr.net           → three.js + lenis scripts and the globe textures
    #   challenges.cloudflare.com  → Turnstile ("I am not a robot")
    #   *.cloudflareinsights.com   → Cloudflare Web Analytics beacon (auto-injected)
    #   connect-src / form-action  → contact form POSTs to the Cloudflare Worker
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://challenges.cloudflare.com https://static.cloudflareinsights.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.jsdelivr.net; connect-src 'self' https://contact.itthreesixty.com.au https://cdn.jsdelivr.net https://cloudflareinsights.com; base-uri 'self'; form-action 'self' https://contact.itthreesixty.com.au; frame-ancestors 'self'; object-src 'none';" always;

    # css/js are not fingerprinted, so always revalidate them.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location ~* \.(woff2|woff|ttf|ico|svg|png|jpg|jpeg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
